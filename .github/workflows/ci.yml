name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      # 🌐 Test chạy HOÀN TOÀN OFFLINE trên tests/recordings/ -> không cần OPENAI_API_KEY.
      - run: uv run pytest -q

